<!DOCTYPE html>
<html lang="zh-CN">
<!-- v2.0-remote-search-20260606 -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时股票监控 - Word文档风格</title>
    <style>
        /* ============================================
           TDesign 设计 Token
           ============================================ */
        :root {
            --td-brand-color: #0052D9;
            --td-brand-color-hover: #366EF4;
            --td-brand-color-active: #003BA5;
            --td-brand-color-light: #ECF2FE;
            --td-text-color-primary: rgba(0, 0, 0, 0.9);
            --td-text-color-secondary: rgba(0, 0, 0, 0.6);
            --td-text-color-placeholder: rgba(0, 0, 0, 0.15);
            --td-bg-color-page: #F5F6F7;
            --td-bg-color-container: #FFFFFF;
            --td-bg-color-container-hover: #F6F6F6;
            --td-border-level-1-color: #E7E7E7;
            --td-border-level-2-color: #DCDCDC;
            --td-shadow-2: 0 2px 12px rgba(0, 0, 0, 0.12);
            --td-shadow-3: 0 8px 24px rgba(0, 0, 0, 0.16);
            --td-radius-medium: 3px;
            --td-radius-large: 6px;
            --td-font-size-body-medium: 14px;
            --td-font-weight-medium: 500;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "微软雅黑", "SimSun", "宋体", Arial, sans-serif;
            background: #eee;
            color: #000000;
            font-size: 14px;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .word-container {
            width: 1000px;
            min-height: 297mm;
            margin: 0 auto;
            background: #ffffff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            padding: 15mm 20mm 25mm 20mm;
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 8px;
        }

        .header h1 {
            font-size: 28px;
            color: #000000;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .header .update-time {
            font-size: 13px;
            color: #666666;
        }

        .add-stock-section {
            margin-bottom: 16px;
        }

        .index-bar {
            display: flex;
            flex-direction: column;
            gap: 0;
            padding: 16px;
            margin-bottom: 16px;
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            font-size: 13px;
            color: #333;
            line-height: 1.6;
        }

        .index-category-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4px 16px;
            padding: 8px 0;
            border-top: 1px dashed #d0d0d0;
        }

        .index-category-group:first-child {
            border-top: none;
            padding-top: 0;
        }

        .index-category-group:last-child {
            padding-bottom: 0;
        }

        .index-item {
            white-space: nowrap;
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .index-name {
            color: #666;
            font-size: 12px;
            flex-shrink: 0;
        }

        .index-price {
            color: #333;
            font-weight: 500;
            flex-shrink: 0;
        }

        .index-change {
            font-size: 12px;
            flex-shrink: 0;
            white-space: nowrap;
            color: #666;
        }

        /* 隐身模式关闭：指数涨跌幅红绿 */
        body:not(.stealth-on) .index-change-up {
            color: #cf1322;
        }

        body:not(.stealth-on) .index-change-down {
            color: #00a854;
        }

        .index-bar.hidden {
            display: none;
        }

        /* Toggle 开关样式 */
.index-config-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--td-bg-color-page);
    border-radius: var(--td-radius-medium);
    flex: 1;
    min-width: 0;
}

.index-config-toggle-row {
    display: flex;
    gap: 16px;
    margin-bottom: 20px;
}

.index-config-toggle .toggle-label {
    font-size: var(--td-font-size-body-medium);
    font-weight: var(--td-font-weight-medium);
    color: var(--td-text-color-primary);
}

.toggle-switch {
    position: relative;
    display: inline-block;
    width: 44px;
    height: 24px;
    flex-shrink: 0;
}

.toggle-switch input {
    opacity: 0;
    width: 0;
    height: 0;
}

.toggle-slider {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: var(--td-border-level-2-color);
    transition: 0.3s;
    border-radius: 24px;
}

.toggle-slider:before {
    position: absolute;
    content: "";
    height: 18px;
    width: 18px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: 0.3s;
    border-radius: 50%;
}

.toggle-switch input:checked + .toggle-slider {
    background-color: var(--td-brand-color);
}

.toggle-switch input:checked + .toggle-slider:before {
    transform: translateX(20px);
}

        .input-group .index-config-btn {
            width: 38px;
            height: 38px;
            padding: 0;
            background: #fff;
            color: #333;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .input-group .index-config-btn:hover {
            background: #f5f5f5;
            border-color: #ccc;
        }

        .input-group .index-config-btn svg path {
            stroke: #333;
        }

        /* ============================================
           大盘指数配置弹窗 - TDesign Dialog 风格
           ============================================ */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-dialog {
            background: var(--td-bg-color-container);
            border-radius: var(--td-radius-large);
            box-shadow: var(--td-shadow-3);
            width: 480px;
            max-height: 70vh;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 24px 24px 20px;
            font-size: 16px;
            font-weight: var(--td-font-weight-medium);
            color: var(--td-text-color-primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: var(--td-radius-medium);
            border: none;
            background: none;
            color: var(--td-text-color-secondary);
            font-size: 16px;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: var(--td-bg-color-container-hover);
            color: var(--td-text-color-primary);
        }

        .modal-body {
            padding: 0 24px 24px;
            overflow-y: auto;
            flex: 1;
        }

        .modal-body label {
            display: block;
            padding: 4px 0;
            font-size: var(--td-font-size-body-medium);
            color: var(--td-text-color-primary);
            cursor: pointer;
        }

        .modal-body input[type="checkbox"] {
            margin-right: 8px;
            vertical-align: middle;
            accent-color: var(--td-brand-color);
        }

        .modal-footer {
            padding: 16px 24px;
            display: flex;
            justify-content: flex-end;
            gap: 16px;
        }

        .modal-footer button {
            padding: 5px 16px;
            border-radius: var(--td-radius-medium);
            cursor: pointer;
            font-size: var(--td-font-size-body-medium);
            font-family: inherit;
            transition: all 0.2s;
            border: 1px solid var(--td-border-level-2-color);
            background: var(--td-bg-color-container);
            color: var(--td-text-color-primary);
            line-height: 22px;
        }

        .modal-footer button:hover {
            background: var(--td-bg-color-container-hover);
            border-color: var(--td-border-level-2-color);
        }

        .modal-footer .btn-primary {
            background: var(--td-brand-color);
            color: #fff;
            border-color: var(--td-brand-color);
        }

        .modal-footer .btn-primary:hover {
            background: var(--td-brand-color-hover);
            border-color: var(--td-brand-color-hover);
        }

        .modal-footer .btn-primary:active {
            background: var(--td-brand-color-active);
            border-color: var(--td-brand-color-active);
        }


        .input-group {
            display: flex;
            gap: 10px;
            position: relative;
        }

        .input-group input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            font-size: 14px;
            color: #000000;
            background: #ffffff;
            outline: none;
            font-family: inherit;
        }

        .input-group input:focus {
            border-color: #555;
            box-shadow: none;
        }

        .input-group input::placeholder {
            color: rgba(0, 0, 0, 0.2);
        }

        .input-group button {
            padding: 8px 20px;
            background: #fff;
            color: #333;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .input-group button:hover {
            background: #f5f5f5;
            border-color: #ccc;
        }

        .search-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 128px;
            background: #ffffff;
            border: 1px solid #ddd;
            border-top: none;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: none;
            font-size: 12px;
        }

        .search-dropdown.visible {
            display: block;
        }

        .search-item {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-item:hover {
            background: #f5f5f5;
        }

        .search-item-left {
            display: flex;
            flex-direction: column;
        }

        .search-item-name {
            font-weight: bold;
            color: #000000;
            font-size: 12px;
        }

        .search-item-code {
            color: #666666;
            font-size: 12px;
            margin-top: 2px;
        }

        .search-item-market {
            font-size: 12px;
            color: #999999;
            padding: 2px 6px;
            background: #f0f0f0;
            border-radius: 2px;
        }

        .search-empty {
            padding: 20px;
            text-align: center;
            color: #999999;
            font-size: 12px;
        }

        .table-wrapper {
            margin-top: 16px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            overflow: visible;
        }

        .stock-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 12px;
            font-family: inherit;
        }

        .stock-table thead {
            background: #f8f9fa;
            color: #000000;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .stock-table th.sortable {
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
        }

        .stock-table th.sortable:hover {
            background: #e9ecef;
        }

        .sort-indicator {
            display: inline-flex;
            flex-direction: column;
            width: 14px;
            margin-left: 3px;
            vertical-align: middle;
            align-self: center;
        }

        .stock-table th {
            padding: 8px 10px;
            text-align: left;
            font-weight: normal;
            font-size: 12px;
            border-right: 1px solid #dee2e6;
            border-bottom: 1px solid #dee2e6;
            font-family: inherit;
        }

        .stock-table th:last-child {
            border-right: none;
        }

        .stock-table tbody tr {
            transition: background 0.2s;
        }

        .stock-table tbody tr:nth-child(odd) {
            background: #fff;
        }

        .stock-table tbody tr:nth-child(even) {
            background: #f8f9fa;
        }

        .stock-table tbody tr:hover {
            background: #e8e8e8;
        }

        .stock-table td {
            padding: 6px 10px;
            border-right: 1px solid #dee2e6;
            border-bottom: 1px solid #dee2e6;
            font-size: 12px;
            color: #000000;
            font-family: inherit;
        }

        .stock-table td:last-child {
            border-right: none;
        }

        .stock-table tbody tr:last-child td {
            border-bottom: none;
        }


        .stock-name {
            position: relative;
            font-weight: normal;
            color: #000000;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
            cursor: default;
        }

        .stock-name[data-tooltip]:hover {
            overflow: visible;
        }

        .stock-name[data-tooltip]:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            left: 0;
            bottom: 100%;
            margin-bottom: 2px;
            padding: 3px 8px;
            background: #333;
            color: #fff;
            font-size: 12px;
            border-radius: 3px;
            white-space: nowrap;
            z-index: 100;
            pointer-events: none;
        }

        .stock-price {
            font-weight: normal;
            font-size: 12px;
            color: #000000;
        }

        .stock-change-up {
            color: #000000;
        }

        .stock-change-down {
            color: #000000;
        }

        .stock-change-flat {
            color: #000000;
        }

        /* 隐身模式关闭：涨红跌绿 */
        body:not(.stealth-on) .stock-change-up {
            color: #cf1322;
        }

        body:not(.stealth-on) .stock-change-down {
            color: #00a854;
        }

        .stock-volume {
            color: #000000;
            font-size: 12px;
        }

        .delete-btn {
            width: 24px;
            height: 24px;
            padding: 0;
            background: none;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            transition: background 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #999;
        }

        .delete-btn svg {
            width: 16px;
            height: 16px;
            display: block;
        }

        .delete-btn:hover {
            background: #f0f0f0;
            color: #333;
        }

        .drag-handle {
            width: 24px;
            height: 24px;
            padding: 0;
            background: none;
            border: none;
            border-radius: 3px;
            cursor: grab;
            transition: background 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #bbb;
        }

        .drag-handle:hover {
            background: #f0f0f0;
            color: #555;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .drag-handle svg {
            width: 14px;
            height: 14px;
            display: block;
        }

        .drag-handle svg path {
            fill: currentColor;
        }

        tr.dragging {
            opacity: 0.3;
            background: #f0f0f0;
        }

        tr.drag-over {
            box-shadow: 0 -2px 0 #4a90d9 inset;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #aaa;
        }

        .empty-state p {
            margin-top: 10px;
            font-size: 12px;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
        }

        @media (max-width: 210mm) {
            .word-container {
                width: 100%;
                padding: 20px;
                box-shadow: none;
            }
        }

        .header h1[contenteditable="true"] {
            outline: none;
            border: 1px solid transparent;
            border-radius: 4px;
            padding: 4px 8px;
            transition: border-color 0.2s;
            display: inline-block;
            min-width: 200px;
        }

        .header h1[contenteditable="true"]:hover {
            border-color: #bdc3c7;
        }

        .header h1[contenteditable="true"]:focus {
            border-color: #3498db;
            background: #f8f9fa;
        }

        .header h1[contenteditable="true"]:empty::before {
            content: '点击输入标题';
            color: #bdc3c7;
        }

        .search-dropdown::-webkit-scrollbar {
            width: 6px;
        }

        .search-dropdown::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .search-dropdown::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 3px;
        }

        .search-dropdown::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* ============================================
           激活码验证弹窗
           ============================================ */
        .verify-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .verify-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .verify-dialog {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.3);
            width: 420px;
            padding: 36px 32px 38px;
            text-align: center;
        }

        .verify-dialog h3 {
            font-size: 20px;
            color: #000;
            margin-bottom: 18px;
            font-weight: 600;
        }

        .verify-qrcode {
            width: 96px;
            height: 96px;
            border: 1px solid #e8e8e8;
            border-radius: 6px;
            display: block;
            margin: 0 auto 14px;
        }

        .verify-hint {
            font-size: 14px;
            color: #666;
            margin-bottom: 18px;
            line-height: 1.6;
        }

        .verify-input-group {
            margin-bottom: 12px;
        }

        .verify-input-group input {
            width: 100%;
            max-width: 220px;
            padding: 10px 14px;
            border: 1px solid #d0d0d0;
            border-radius: 6px;
            font-size: 15px;
            text-align: center;
            letter-spacing: 2px;
            outline: none;
            transition: border-color 0.3s;
            display: block;
            margin: 0 auto;
        }

        .verify-input-group input:focus {
            border-color: var(--td-brand-color, #0052D9);
        }

        .verify-input-group input.error {
            border-color: #e34d59;
        }

        .verify-btn {
            display: block;
            width: 100%;
            max-width: 220px;
            margin: 0 auto;
            padding: 10px 20px;
            background: var(--td-brand-color, #0052D9);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .verify-btn:hover {
            background: var(--td-brand-color-hover, #366EF4);
        }

        .verify-btn:disabled {
            background: #bbb;
            cursor: not-allowed;
        }

        .verify-error {
            color: #e34d59;
            font-size: 13px;
            margin-top: 8px;
            min-height: 20px;
        }

        /* ============================================
           会话过期提示条
           ============================================ */
        .session-alert {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10000;
            background: #e34d59;
            color: #fff;
            text-align: center;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
        }

        .session-alert a {
            color: #fff;
            font-weight: bold;
            text-decoration: underline;
            cursor: pointer;
        }

        .session-alert.show {
            display: block;
        }
    </style>
</head>
<body>
    <!-- 会话过期提示条 -->
    <div class="session-alert" id="sessionAlert">
        ⚠ 已超过 20 分钟未刷新页面，数据已停止更新。请 <a onclick="location.reload()">点击刷新</a> 重新连接
    </div>
    <!-- 激活码验证弹窗 -->
    <div class="verify-overlay" id="verifyOverlay">
        <div class="verify-dialog">
            <h3>激活验证</h3>
            <img class="verify-qrcode" src="/public/qrcode.jpg" width="96" height="96" alt="公众号二维码">
            <p class="verify-hint">扫码关注公众号，发送"激活码"即可获得</p>
            <div class="verify-input-group">
                <input type="text" id="verifyCodeInput" placeholder="输入6位激活码" maxlength="6">
            </div>
            <button class="verify-btn" onclick="submitVerifyCode()">确认验证</button>
            <p class="verify-error" id="verifyError"></p>
        </div>
    </div>

    <div class="word-container">
        <div class="header">
            <h1 id="pageTitle" contenteditable="true">📈 实时股票监控表</h1>
            <div class="update-time" id="updateTime">最后更新：-</div>
        </div>

        <div class="index-bar" id="indexBar">
                <span style="color:#999;font-size:12px">加载中...</span>
            </div>

        <div class="add-stock-section">
            <div class="input-group">
                <input 
                    type="text" 
                    id="stockInput" 
                    placeholder="输入股票/基金/可转债名称或代码"
                    oninput="searchStock(this.value)"
                    onkeypress="if(event.key==='Enter') selectFirstResult()"
                >
                <button onclick="selectFirstResult()">添加</button>
                <button onclick="openIndexConfig()" class="index-config-btn" title="配置指数">
                    <svg width="16" height="16" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7.94971 11.9497H39.9497" stroke="#333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M7.94971 23.9497H39.9497" stroke="#333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M7.94971 35.9497H39.9497" stroke="#333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <div class="search-dropdown" id="searchDropdown"></div>
            </div>
        </div>

        <div class="table-wrapper">
        <table class="stock-table" id="stockTable">
            <thead>
                <tr>
                    <th style="width: 28px; text-align: center;">#</th>
                    <th style="width: 130px; text-align: left;">名称</th>
                    <th style="width: 68px; text-align: right;">当前价</th>
                    <th style="width: 64px; text-align: right;">涨跌额</th>
                    <th style="width: 72px; text-align: right;" class="sortable" onclick="toggleSort('percent')">涨跌幅<span class="sort-indicator" id="sortIndicator"></span></th>
                    <th style="width: 66px; text-align: right;">昨收</th>
                    <th style="width: 68px; text-align: right;">最高价</th>
                    <th style="width: 68px; text-align: right;">最低价</th>
                    <th style="width: 72px; text-align: right;">成交(万手)</th>
                    <th style="width: 60px; text-align: right;">换手率</th>
                    <th style="width: 66px; text-align: center;">操作</th>
                </tr>
            </thead>
            <tbody id="stockTableBody">
            </tbody>
        </table>
        </div>

        <div class="empty-state" id="emptyState" style="display: none;">
            <p>暂无监控标的</p>
            <p style="margin-top: 4px;">可在上方输入框中添加股票/基金/可转债</p>
        </div>
    </div>

    <script>
        let monitoredStocks = [];
        let updateInterval = null;
        let sseConnection = null;  // SSE 连接
        let sessionTimer = null;   // 14分钟会话超时兜底定时器
        let currentSearchResults = [];
        let sortState = null; // null | 'percent-asc' | 'percent-desc'
        let stealthMode = true; // 隐身模式默认开启

        // ========== 激活码验证 ==========
        var VERIFY_CODES = ['987987', '201712', '960807', '110630'];
        var VERIFY_KEY = 'webstock_verified';

        function isLocallyVerified() {
            return localStorage.getItem(VERIFY_KEY) === 'true';
        }

        function markLocalVerified() {
            localStorage.setItem(VERIFY_KEY, 'true');
        }

        function showVerifyOverlay() {
            document.getElementById('verifyOverlay').classList.add('show');
            setTimeout(function() {
                document.getElementById('verifyCodeInput').focus();
            }, 300);
        }

        function hideVerifyOverlay() {
            document.getElementById('verifyOverlay').classList.remove('show');
        }

        function submitVerifyCode() {
            var input = document.getElementById('verifyCodeInput');
            var errorEl = document.getElementById('verifyError');
            var code = input.value.trim();

            if (!code) {
                errorEl.textContent = '请输入激活码';
                input.classList.add('error');
                return;
            }

            if (VERIFY_CODES.indexOf(code) !== -1) {
                errorEl.textContent = '';
                input.classList.remove('error');
                markLocalVerified();
                hideVerifyOverlay();
                startInitialization();
            } else {
                errorEl.textContent = '激活码错误，请重试';
                input.classList.add('error');
                input.value = '';
                input.focus();
            }
        }

        // ========== 主初始化 ==========
        window.onload = function() {
            if (isLocallyVerified()) {
                startInitialization();
            } else {
                showVerifyOverlay();
            }
        };

        function startInitialization() {
            loadPageTitle();
            loadStocks();
            renderTable();

            // 恢复排序状态
            var savedSort = localStorage.getItem('sortState');
            sortState = savedSort || null;
            updateSortIndicator();

            // 恢复隐身模式
            var savedStealth = localStorage.getItem('stealthMode');
            stealthMode = savedStealth === null ? true : savedStealth === 'true';
            applyStealthMode();

            // 应用指数看板总开关状态
            if (!isIndexDashboardEnabled()) {
                document.getElementById('indexBar').classList.add('hidden');
            }

            startAutoUpdate();

            // 拖拽排序
            var dragSrcIndex = -1;
            var tbody = document.getElementById('stockTableBody');

            tbody.addEventListener('dragstart', function(e) {
                var row = e.target.closest('tr');
                if (!row) return;
                dragSrcIndex = parseInt(row.id.replace('row-', ''));
                row.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', dragSrcIndex.toString());
            });

            tbody.addEventListener('dragend', function(e) {
                var row = e.target.closest('tr');
                if (row) row.classList.remove('dragging');
                // 清除所有拖拽状态
                var rows = tbody.querySelectorAll('tr');
                rows.forEach(function(r) { r.classList.remove('drag-over'); });
                dragSrcIndex = -1;
            });

            tbody.addEventListener('dragover', function(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                var row = e.target.closest('tr');
                if (!row || dragSrcIndex === -1) return;
                var dstIndex = parseInt(row.id.replace('row-', ''));
                if (dstIndex === dragSrcIndex) return;
                // 清除之前的指示器
                var rows = tbody.querySelectorAll('tr');
                rows.forEach(function(r) { r.classList.remove('drag-over'); });
                row.classList.add('drag-over');
            });

            tbody.addEventListener('dragleave', function(e) {
                var row = e.target.closest('tr');
                if (row) row.classList.remove('drag-over');
            });

            tbody.addEventListener('drop', function(e) {
                e.preventDefault();
                var row = e.target.closest('tr');
                if (!row || dragSrcIndex === -1) return;
                var dstIndex = parseInt(row.id.replace('row-', ''));
                if (dstIndex === dragSrcIndex) return;
                // 重排序
                var item = monitoredStocks.splice(dragSrcIndex, 1)[0];
                monitoredStocks.splice(dstIndex, 0, item);
                localStorage.setItem('monitoredStocks', JSON.stringify(monitoredStocks));
                renderTable();
                dragSrcIndex = -1;
            });
        };

        function requestJson(url, options) {
            options = options || {};
            if (typeof window.fetch === 'function') {
                return fetch(url, options).then(function(response) {
                    if (!response.ok) {
                        throw new Error('HTTP error! status: ' + response.status);
                    }
                    return response.json();
                });
            }

            return new Promise(function(resolve, reject) {
                var xhr = new XMLHttpRequest();
                xhr.open(options.method || 'GET', url, true);

                var headers = options.headers || {};
                Object.keys(headers).forEach(function(key) {
                    xhr.setRequestHeader(key, headers[key]);
                });

                xhr.onload = function() {
                    if (xhr.status < 200 || xhr.status >= 300) {
                        reject(new Error('HTTP error! status: ' + xhr.status));
                        return;
                    }

                    try {
                        resolve(JSON.parse(xhr.responseText));
                    } catch (error) {
                        reject(error);
                    }
                };

                xhr.onerror = function() {
                    reject(new Error('网络请求失败'));
                };

                xhr.send(options.body || null);
            });
        }

        function normalizeSearchText(text) {
            return String(text || '')
                .toLowerCase()
                .replace(/[\s\-_/\\.·()（）]+/g, '')
                .trim();
        }

        function decodeUnicode(str) {
            if (!str) return '';
            return str.replace(/\\u([\dA-Fa-f]{4})/g, function(_, hex) {
                return String.fromCharCode(parseInt(hex, 16));
            });
        }

        function isFuzzySequenceMatch(target, query) {
            if (!query) return false;

            var targetIndex = 0;
            for (var queryIndex = 0; queryIndex < query.length; queryIndex++) {
                targetIndex = target.indexOf(query[queryIndex], targetIndex);
                if (targetIndex === -1) return false;
                targetIndex++;
            }

            return true;
        }

        function getSearchScore(stock, query) {
            var normalizedQuery = normalizeSearchText(query);
            var normalizedName = normalizeSearchText(stock.name);
            var normalizedCode = normalizeSearchText(stock.code);
            var codeWithoutMarket = normalizedCode.replace(/^(sh|sz|hk|us)/, '');

            if (!normalizedQuery) return 0;
            if (normalizedCode === normalizedQuery || codeWithoutMarket === normalizedQuery) return 100;
            if (normalizedName === normalizedQuery) return 95;
            if (normalizedName.startsWith(normalizedQuery)) return 85;
            if (normalizedCode.indexOf(normalizedQuery) !== -1 || codeWithoutMarket.indexOf(normalizedQuery) !== -1) return 80;
            if (normalizedName.indexOf(normalizedQuery) !== -1) return 70;
            if (isFuzzySequenceMatch(normalizedName, normalizedQuery)) return 55;
            if (isFuzzySequenceMatch(normalizedCode, normalizedQuery)) return 60;

            return 0;
        }

        function getSearchThreshold(query) {
            var trimmed = (query || '').trim();
            if (!trimmed) return -1;
            var firstChar = trimmed[0];
            if (/[\u4e00-\u9fa5]/.test(firstChar)) return 2;
            if (/[0-9]/.test(firstChar)) return 3;
            if (/[a-zA-Z]/.test(firstChar)) return 2;
            return 3;
        }

        var remoteSearchTimer = null;
        var remoteSearchToken = 0;

        // 处理中文输入法：组合输入期间不触发搜索
        var isComposing = false;
        var inputEl = document.getElementById('stockInput');
        inputEl.addEventListener('compositionstart', function() { isComposing = true; });
        inputEl.addEventListener('compositionend', function(e) {
            isComposing = false;
            searchStock(e.target.value);
        });

        function searchStock(query) {
            // 中文输入法组合中，跳过
            if (isComposing) return;

            var threshold = getSearchThreshold(query);
            if (!query || threshold < 0 || query.trim().length < threshold) {
                hideSearchDropdown();
                currentSearchResults = [];
                if (remoteSearchTimer) { clearTimeout(remoteSearchTimer); }
                return;
            }

            // 直接远端搜索（跳过本地匹配）
            if (remoteSearchTimer) { clearTimeout(remoteSearchTimer); }
            showSearchLoading();
            remoteSearchTimer = setTimeout(function() {
                var q = query.trim();
                remoteSearchToken++;
                var token = remoteSearchToken;
                searchFromRemote(q, token);
            }, 300);
        }

        function showSearchLoading() {
            var dropdown = document.getElementById('searchDropdown');
            dropdown.innerHTML = '<div class="search-empty">搜索中...</div>';
            dropdown.classList.add('visible');
        }

        function searchFromRemote(query, token) {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/api/search-stocks?q=' + encodeURIComponent(query));
            xhr.onload = function() {
                // 忽略过期请求
                if (token !== remoteSearchToken) return;
                if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                        var resp = JSON.parse(xhr.responseText);
                        var remoteResults = (resp && resp.data) || [];
                        currentSearchResults = remoteResults;
                        if (remoteResults.length > 0) {
                            showSearchResults(remoteResults);
                        } else {
                            showSearchEmpty();
                        }
                    } catch (e) {
                        showSearchEmpty();
                    }
                } else {
                    showSearchEmpty();
                }
            };
            xhr.onerror = function() {
                if (token !== remoteSearchToken) return;
                showSearchEmpty();
            };
            xhr.send();
        }

        // 根据股票信息获取市场标签
        function getMarketLabel(stock) {
            var name = (stock.name || '').toLowerCase();
            // 优先识别可转债
            if (name.indexOf('转债') !== -1 || name.indexOf('可转债') !== -1) {
                return '可转债';
            }
            // 识别基金（ETF、LOF、基金等）
            if (name.indexOf('etf') !== -1 || name.indexOf('lof') !== -1 || name.indexOf('基金') !== -1) {
                return '基金';
            }
            // 根据市场代码映射
            var market = stock.market;
            if (market === 'sh') return '沪A';
            if (market === 'sz') return '深A';
            if (market === 'bj') return '北交所';
            if (market === 'hk') return '港股';
            if (market === 'us') return '美股';
            if (market === 'idx') return '指数';
            return market || '';
        }

        function showSearchResults(results) {
            var dropdown = document.getElementById('searchDropdown');
            var html = '';

            results.forEach(function(stock, index) {
                var displayName = decodeUnicode(stock.name);
                var marketLabel = getMarketLabel(stock);
                html += '<div class="search-item" onclick="selectStock(\'' + stock.code + '\', \'' + displayName.replace(/'/g, "\\'") + '\')">' +
                    '<div class="search-item-left">' +
                        '<div class="search-item-name">' + displayName + '</div>' +
                        '<div class="search-item-code">' + stock.code + '</div>' +
                    '</div>' +
                    '<div class="search-item-market">' + marketLabel + '</div>' +
                '</div>';
            });

            dropdown.innerHTML = html;
            dropdown.classList.add('visible');
        }

        function showSearchEmpty() {
            var dropdown = document.getElementById('searchDropdown');
            dropdown.innerHTML = '<div class="search-empty">未找到匹配的股票<br><span style="font-size:12px;color:#999">可直接输入代码添加，如：sh601059</span></div>';
            dropdown.classList.add('visible');
        }

        function selectStock(code, name) {
            if (monitoredStocks.indexOf(code) !== -1) {
                alert('该股票已在监控列表中！');
                return;
            }

            monitoredStocks.push(code);
            saveStocks();
            renderTable();

            document.getElementById('stockInput').value = '';
            hideSearchDropdown();

            updateStockData();
        }

        function selectFirstResult() {
            if (currentSearchResults.length > 0) {
                selectStock(currentSearchResults[0].code, currentSearchResults[0].name);
            } else {
                addStockDirect();
            }
        }

        function hideSearchDropdown() {
            var dropdown = document.getElementById('searchDropdown');
            if (dropdown) {
                dropdown.classList.remove('visible');
            }
        }

        function loadStocks() {
            var saved = localStorage.getItem('monitoredStocks');
            if (saved) {
                monitoredStocks = JSON.parse(saved);
            }
        }

        function saveStocks() {
            localStorage.setItem('monitoredStocks', JSON.stringify(monitoredStocks));
        }

        async function addStockDirect() {
            var input = document.getElementById('stockInput');
            var code = input.value.trim();

            if (!code) {
                alert('请输入股票代码或名称！');
                return;
            }

            if (!isValidStockCode(code)) {
                alert('股票代码格式错误！\n正确格式：sh600519, sz000001, hk00700, bj835185\n\n也可直接输入股票名称，下拉列表中选择添加');
                return;
            }

            if (monitoredStocks.indexOf(code) !== -1) {
                alert('该股票已在监控列表中！');
                return;
            }

            try {
                var result = await requestJson('/api/stocks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ codes: [code] })
                });

                if (!result.success || !result.data || result.data.length === 0) {
                    alert('代码 ' + code + ' 无效或暂无数据，请检查代码是否正确');
                    return;
                }

                monitoredStocks.push(code);
                saveStocks();
                renderTable();
                input.value = '';

                updateStockData();
            } catch (error) {
                alert('验证代码失败：' + error.message);
            }
        }

        function isValidStockCode(code) {
            var pattern = /^(sh|sz|hk|us|bj)[0-9A-Z.]+$/i;
            return pattern.test(code);
        }

        function deleteStock(index) {
            monitoredStocks.splice(index, 1);
            saveStocks();
            renderTable();
        }

        function renderTable() {
            var tbody = document.getElementById('stockTableBody');
            var emptyState = document.getElementById('emptyState');

            if (monitoredStocks.length === 0) {
                tbody.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            var html = '';
            monitoredStocks.forEach(function(code, index) {
                html += '<tr id="row-' + index + '" draggable="true">' +
                    '<td style="text-align: center;">' + (index + 1) + '</td>' +
                    '<td style="text-align: left;"><span class="stock-name" id="name-' + index + '" data-tooltip="' + code.toUpperCase() + '">加载中...</span></td>' +
                    '<td style="text-align: right;"><span class="stock-price" id="price-' + index + '">-</span></td>' +
                    '<td style="text-align: right;"><span id="change-' + index + '">-</span></td>' +
                    '<td style="text-align: right;"><span id="percent-' + index + '">-</span></td>' +
                    '<td style="text-align: right;"><span class="stock-price" id="closeYest-' + index + '">-</span></td>' +
                    '<td style="text-align: right;"><span class="stock-price" id="high-' + index + '">-</span></td>' +
                    '<td style="text-align: right;"><span class="stock-price" id="low-' + index + '">-</span></td>' +
                    '<td style="text-align: right;"><span class="stock-volume" id="volume-' + index + '">-</span></td>' +
                    '<td style="text-align: right;"><span id="turnover-' + index + '">-</span></td>' +
                    '<td style="text-align: center;">' +
                        '<button class="delete-btn" onclick="deleteStock(' + index + ')" aria-label="删除">' +
                            '<svg width="16" height="16" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">' +
                                '<path d="M15 12L16.2 5H31.8L33 12" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>' +
                                '<path d="M6 12H42" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>' +
                                '<path fill-rule="evenodd" clip-rule="evenodd" d="M37 12L35 43H13L11 12H37Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>' +
                                '<path d="M19 35H29" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>' +
                            '</svg>' +
                        '</button>' +
                        '<button class="drag-handle" aria-label="拖拽排序">' +
                            '<svg width="14" height="14" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">' +
                                '<path fill-rule="evenodd" clip-rule="evenodd" d="M19 10C19 12.2091 17.2091 14 15 14C12.7909 14 11 12.2091 11 10C11 7.79086 12.7909 6 15 6C17.2091 6 19 7.79086 19 10ZM15 28C17.2091 28 19 26.2091 19 24C19 21.7909 17.2091 20 15 20C12.7909 20 11 21.7909 11 24C11 26.2091 12.7909 28 15 28ZM15 42C17.2091 42 19 40.2091 19 38C19 35.7909 17.2091 34 15 34C12.7909 34 11 35.7909 11 38C11 40.2091 12.7909 42 15 42Z" fill="currentColor"/>' +
                                '<path fill-rule="evenodd" clip-rule="evenodd" d="M37 10C37 12.2091 35.2091 14 33 14C30.7909 14 29 12.2091 29 10C29 7.79086 30.7909 6 33 6C35.2091 6 37 7.79086 37 10ZM33 28C35.2091 28 37 26.2091 37 24C37 21.7909 35.2091 20 33 20C30.7909 20 29 21.7909 29 24C29 26.2091 30.7909 28 33 28ZM33 42C35.2091 42 37 40.2091 37 38C37 35.7909 35.2091 34 33 34C30.7909 34 29 35.7909 29 38C29 40.2091 30.7909 42 33 42Z" fill="currentColor"/>' +
                            '</svg>' +
                        '</button>' +
                    '</td>' +
                '</tr>';
            });
            tbody.innerHTML = html;

            updateStockData();
        }

        // ========= 排序功能 =========
        function toggleSort(field) {
            if (sortState === field + '-asc') {
                sortState = field + '-desc';
            } else if (sortState === field + '-desc') {
                sortState = null;
            } else {
                sortState = field + '-asc';
            }
            localStorage.setItem('sortState', sortState || '');
            updateSortIndicator();
            applySort();
        }

        function updateSortIndicator() {
            var indicator = document.getElementById('sortIndicator');
            if (!indicator) return;

            var upColor, downColor;
            if (sortState === 'percent-asc') {
                upColor = '#333'; downColor = '#B0B0B0';
            } else if (sortState === 'percent-desc') {
                upColor = '#B0B0B0'; downColor = '#333';
            } else {
                upColor = '#B0B0B0'; downColor = '#B0B0B0';
            }

            var upSvg = '<svg width="12" height="8" viewBox="0 0 24 12" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block"><path d="M12 3L17.5 8.5H6.5L12 3Z" fill="' + upColor + '"/></svg>';
            var downSvg = '<svg width="12" height="8" viewBox="0 0 24 12" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;margin-top:-2px"><path d="M12 8.5L17.5 3H6.5L12 8.5Z" fill="' + downColor + '"/></svg>';

            indicator.innerHTML = upSvg + downSvg;
        }

        function applySort() {
            var tbody = document.getElementById('stockTableBody');
            if (!tbody) return;
            var rows = Array.from(tbody.querySelectorAll('tr'));
            if (rows.length === 0) return;

            if (!sortState) {
                // 恢复原始顺序
                rows.sort(function(a, b) {
                    return parseInt(a.id.replace('row-', '')) - parseInt(b.id.replace('row-', ''));
                });
            } else {
                rows.sort(function(a, b) {
                    var aText = document.getElementById('percent-' + a.id.replace('row-', ''));
                    var bText = document.getElementById('percent-' + b.id.replace('row-', ''));
                    var aVal = parseFloat(aText ? aText.textContent : '0') || 0;
                    var bVal = parseFloat(bText ? bText.textContent : '0') || 0;
                    return sortState === 'percent-asc' ? aVal - bVal : bVal - aVal;
                });
            }

            // 重新排列 DOM 并更新序号
            rows.forEach(function(row, i) {
                tbody.appendChild(row);
                var firstCell = row.querySelector('td:first-child');
                if (firstCell) firstCell.textContent = i + 1;
            });
        }

        async function updateStockData() {
            if (monitoredStocks.length === 0) return;

            try {
                var result = await requestJson('/api/stocks', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ codes: monitoredStocks })
                });

                if (result.success) {
                    updateTableData(result.data);
                    applySort();
                    document.getElementById('updateTime').textContent = 
                        '最后更新：' + new Date().toLocaleTimeString('zh-CN');
                } else {
                    throw new Error(result.error || '未知错误');
                }

            } catch (error) {
                console.error('更新数据失败：', error);
                document.getElementById('updateTime').textContent = 
                    '更新失败：' + new Date().toLocaleTimeString('zh-CN');
            }
        }

        function updateTableData(stocksData) {
            stocksData.forEach(function(stock, index) {
                if (!document.getElementById('row-' + index)) return;

                document.getElementById('name-' + index).textContent = stock.name;
                document.getElementById('price-' + index).textContent = formatPrice(stock.currentPrice, stock.stale);
                document.getElementById('closeYest-' + index).textContent = formatPrice(stock.yesterdayClose, stock.stale);
                document.getElementById('high-' + index).textContent = formatPrice(stock.highPrice, stock.stale);
                document.getElementById('low-' + index).textContent = formatPrice(stock.lowPrice, stock.stale);
                
                var changeEl = document.getElementById('change-' + index);
                var changeVal = stock.change;
                changeEl.textContent = stock.stale ? '-' : (changeVal >= 0 ? '+' : '') + changeVal.toFixed(2);
                changeEl.className = changeVal > 0 ? 'stock-change-up' : changeVal < 0 ? 'stock-change-down' : 'stock-change-flat';
                
                var percentEl = document.getElementById('percent-' + index);
                var percentVal = stock.changePercent;
                percentEl.textContent = stock.stale ? '-' : (percentVal >= 0 ? '+' : '') + percentVal.toFixed(2) + '%';
                percentEl.className = percentVal > 0 ? 'stock-change-up' : percentVal < 0 ? 'stock-change-down' : 'stock-change-flat';
                
                document.getElementById('volume-' + index).textContent = stock.stale ? '-' : formatVolume(stock.volume);
                document.getElementById('turnover-' + index).textContent = stock.stale ? '-' : (stock.turnoverRate > 0 ? stock.turnoverRate.toFixed(2) + '%' : '-');
            });
        }

        function formatPrice(price, stale) {
            var value = parseFloat(price);
            if (stale || isNaN(value)) return '-';
            return value.toFixed(2);
        }

        function formatVolume(volume) {
            var vol = parseInt(volume);
            if (isNaN(vol)) return '-';
            return (vol / 10000).toFixed(2);
        }

        function startAutoUpdate() {
            // SSE 推送股票数据，替代轮询
            if (sseConnection) {
                sseConnection.close();
            }
            if (sessionTimer) {
                clearTimeout(sessionTimer);
            }
            sseConnection = new EventSource('/api/stream');

            // 监听股票数据推送
            sseConnection.onmessage = function(e) {
                try {
                    var msg = JSON.parse(e.data);
                    if (msg.success && msg.data) {
                        updateTableData(msg.data);
                        applySort();
                        document.getElementById('updateTime').textContent =
                            '最后更新：' + new Date().toLocaleTimeString('zh-CN');
                    }
                } catch (err) {
                    // 忽略非数据消息（如 connected）
                }
            };

            // 监听会话过期事件（服务端14分钟超时）
            sseConnection.addEventListener('expired', function() {
                sseConnection.close();
                if (sessionTimer) { clearTimeout(sessionTimer); }
                document.getElementById('sessionAlert').classList.add('show');
            });

            sseConnection.onerror = function() {
                // SSE 断线后 3 秒自动重连，无需额外处理
            };

            // 客户端兜底：14分钟后如果SSE还连着（服务端事件未到达），主动显示提示
            sessionTimer = setTimeout(function() {
                sseConnection.close();
                document.getElementById('sessionAlert').classList.add('show');
            }, 14 * 60 * 1000);

            // 首次加载立即请求一次
            updateStockData();
            updateIndexBar();

            // 指数跟随 SSE 节奏更新：每 3 次推送（约 9 秒）更新一次指数看板
            var indexTick = 0;
            var origOnMessage = sseConnection.onmessage;
            sseConnection.onmessage = function(e) {
                origOnMessage(e);
                indexTick++;
                if (indexTick % 3 === 0) {
                    updateIndexBar();
                }
            };
        }

        function getSelectedIndices() {
            var saved = localStorage.getItem('selectedIndices');
            if (saved) {
                try { return JSON.parse(saved); } catch(e) {}
            }
            return DEFAULT_INDICES.slice();

            localStorage.setItem('selectedIndices', JSON.stringify(codes));

        function isIndexDashboardEnabled() {
            var saved = localStorage.getItem('indexDashboardEnabled');
            if (saved === null) return true; // 默认开启
            return saved === 'true';
        }

        function saveIndexDashboardEnabled(enabled) {
            localStorage.setItem('indexDashboardEnabled', enabled.toString());
            var bar = document.getElementById('indexBar');
            if (enabled) {
                bar.classList.remove('hidden');
                updateIndexBar();
            } else {
                bar.classList.add('hidden');
            }
        }

        function applyStealthMode() {
            if (stealthMode) {
                document.body.classList.add('stealth-on');
            } else {
                document.body.classList.remove('stealth-on');
            }
        }

        function openIndexConfig() {
            var selected = getSelectedIndices();
            var body = document.getElementById('indexConfigBody');
            var dashboardEnabled = isIndexDashboardEnabled();
            var html = '';

            // 隐身模式 + 指数看板 并排
            html += '<div class="index-config-toggle-row">';
            html += '<div class="index-config-toggle">';
            html += '<span class="toggle-label">隐身模式</span>';
            html += '<label class="toggle-switch">';
            html += '<input type="checkbox" id="stealthModeToggle"' + (stealthMode ? ' checked' : '') + '>';
            html += '<span class="toggle-slider"></span>';
            html += '</label>';
            html += '</div>';
            html += '<div class="index-config-toggle">';
            html += '<span class="toggle-label">指数看板</span>';
            html += '<label class="toggle-switch">';
            html += '<input type="checkbox" id="indexDashboardToggle"' + (dashboardEnabled ? ' checked' : '') + '>';
            html += '<span class="toggle-slider"></span>';
            html += '</label>';
            html += '</div>';
            html += '</div>';

            var groups = {};
            ALL_INDICES.forEach(function(idx) {
                if (!groups[idx.market]) groups[idx.market] = [];
                groups[idx.market].push(idx);
            });

            var marketOrder = ['A股','行业板块','港股','美股','商品','汇率','债券'];
            marketOrder.forEach(function(market) {
                var list = groups[market];
                if (!list) return;
                html += '<div style="font-size:12px;color:var(--td-text-color-placeholder);margin-top:20px;margin-bottom:8px">' + market + '</div>';
                html += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px 8px">';
                list.forEach(function(idx) {
                    var checked = selected.indexOf(idx.code) !== -1 ? ' checked' : '';
                    html += '<label><input type="checkbox" value="' + idx.code + '"' + checked + '>' + idx.name + '</label>';
                });
                html += '</div>';
            });

            body.innerHTML = html;
            document.getElementById('indexConfigModal').classList.add('show');
        }

        function closeIndexConfig() {
            document.getElementById('indexConfigModal').classList.remove('show');
        }

        function saveIndexConfig() {
            var checks = document.querySelectorAll('#indexConfigBody input[type=checkbox]:checked');
            var codes = [];
            checks.forEach(function(cb) { codes.push(cb.value); });
            if (codes.length === 0) {
                alert('至少选择一个指数');
                return;
            }
            saveSelectedIndices(codes);

            // 保存总开关状态
            var toggleEl = document.getElementById('indexDashboardToggle');
            var enabled = toggleEl ? toggleEl.checked : true;
            saveIndexDashboardEnabled(enabled);

            // 保存隐身模式
            var stealthEl = document.getElementById('stealthModeToggle');
            stealthMode = stealthEl ? stealthEl.checked : true;
            localStorage.setItem('stealthMode', stealthMode.toString());
            applyStealthMode();

            closeIndexConfig();
            if (enabled) {
                updateIndexBar();
            }
        }

        async function updateIndexBar() {
            // 总开关关闭时不更新
            if (!isIndexDashboardEnabled()) {
                document.getElementById('indexBar').classList.add('hidden');
                return;
            }
            document.getElementById('indexBar').classList.remove('hidden');

            try {
                var selected = getSelectedIndices();
                var result = await requestJson('/api/indices?codes=' + selected.join(','));
                if (!result.success || !result.data) return;

                var indexMap = {};
                result.data.forEach(function(idx) {
                    indexMap[idx.code.toLowerCase()] = idx;
                });

                var bar = document.getElementById('indexBar');
                var html = '';

                // 构建代码->ALL_INDICES名称的映射，确保看板和配置弹窗展示一致
                var nameMap = {};
                ALL_INDICES.forEach(function(item) {
                    nameMap[item.code] = item.name;
                });

                var marketOrder = ['A股','行业板块','港股','美股','商品','汇率','债券'];
                var marketGroups = {};
                selected.forEach(function(code) {
                    var found = ALL_INDICES.find(function(item) { return item.code === code; });
                    var market = found ? found.market : '其他';
                    if (!marketGroups[market]) marketGroups[market] = [];
                    marketGroups[market].push(code);
                });

                marketOrder.forEach(function(market) {
                    var codes = marketGroups[market];
                    if (!codes || codes.length === 0) return;
                    var items = '';
                    codes.forEach(function(code) {
                        var idx = indexMap[code.toLowerCase()];
                        if (!idx) return;
                        var change = idx.changePercent || 0;
                        var sign = change > 0 ? '+' : '';
                        var changeClass = 'index-change' + (change > 0 ? ' index-change-up' : change < 0 ? ' index-change-down' : '');
                        var isFx = /^fx/.test(code);
                        var displayName = nameMap[code] || idx.name;
                        var decimals = isFx ? 4 : 2;
                        var changeHtml = '';
                        if (!isFx) {
                            changeHtml = '<span class="' + changeClass + '">(' + sign + change.toFixed(2) + '%)</span>';
                        }
                        items += '<span class="index-item">' +
                            '<span class="index-name">' + displayName + '</span>' +
                            '<span class="index-price">' + idx.currentPrice.toFixed(decimals) + '</span>' +
                            changeHtml +
                        '</span>';
                    });
                    if (items) {
                        html += '<div class="index-category-group">' + items + '</div>';
                    }
                });

                bar.innerHTML = html || '<span style="color:#999;font-size:12px">请点击 ⚙ 配置指数</span>';
            } catch (e) {
                console.error('大盘数据获取失败:', e);
            }
        }

            var savedTitle = localStorage.getItem('pageTitle');
            var titleEl = document.getElementById('pageTitle');
            if (savedTitle && titleEl) {
                titleEl.textContent = savedTitle;

            if (titleEl) {
                titleEl.addEventListener('blur', savePageTitle);
                titleEl.addEventListener('paste', onTitlePaste);

        function onTitlePaste(e) {
            e.preventDefault();
            var text = (e.clipboardData || window.clipboardData).getData('text/plain');
            document.execCommand('insertText', false, text);
        }

        function savePageTitle() {
            var titleEl = document.getElementById('pageTitle');
            var text = titleEl.innerText.trim();
            if (text) {
                localStorage.setItem('pageTitle', text);
